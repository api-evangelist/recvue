description: >-
  RecVue is an enterprise platform sold through a direct sales motion. There is
  no public self-service pricing or free tier - production and sandbox tenants,
  API credentials, and the RevOS modules (billing, revenue recognition,
  order-to-cash, usage/monetization, partner settlements) are provisioned under
  a negotiated enterprise agreement. Third-party listings put RecVue's entry
  point at roughly $1,000+/month, but actual pricing is quote-based and depends
  on transaction volume, modules, entities, and integrations. The developer API
  itself carries no separate published fee; access follows the platform
  contract. All figures here are unreconciled - confirm with RecVue sales.
notes: >-
  RecVue does not publish a pricing page; prospects request a demo. RecVue is a
  Palo Alto company (founded 2016) serving large enterprises across telecom,
  transportation and logistics, technology, AI infrastructure, and business
  services. Verify current commercial terms directly with RecVue.
