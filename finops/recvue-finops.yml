meters:
- name: platform_subscription
  description: Contracted RevOS platform subscription (module scope, entities, support tier).
  unit: contract
  aggregation: sum
  dimensions:
  - tenant
  - modules
- name: transaction_volume
  description: Billed/processed transactions across billing and revenue, a primary contract sizing driver.
  unit: transactions
  aggregation: sum
  dimensions:
  - tenant
  - entity
- name: entities
  description: Number of legal entities configured in the platform.
  unit: entities
  aggregation: max
  dimensions:
  - tenant
principles:
- name: Visibility
  description: Track transaction and billing volume per entity against the contracted tier to anticipate true-ups at renewal.
- name: Allocation
  description: Map modules and entities to internal cost centers and business units.
- name: Optimization
  description: Right-size module scope and use the Bulk API and asynchronous programs to keep processing efficient; consolidate integrations.
- name: Accountability
  description: Assign a platform owner in the office of the CFO; review volume and module usage before each renewal.
