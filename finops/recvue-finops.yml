description: >-
  FinOps view of RecVue spend. RecVue is an enterprise SaaS platform billed
  under a negotiated agreement rather than usage-metered public API pricing.
  Cost drivers are the contracted platform subscription plus the scope of
  modules (billing, revenue recognition, order-to-cash, usage/monetization,
  partner settlements), transaction/billing volume, number of legal entities,
  and integration footprint. There is no separate public per-call API fee; API
  and sandbox access are included in the platform contract. Per-unit rates are
  not public and are not reconciled here.
notes: >-
  RecVue publishes no pricing page; commercial terms are quote-based. Track spend
  against the contracted subscription and any volume-tier true-ups; the platform
  processes very high transaction volumes (RecVue cites 350M monthly
  transactions and $110B managed revenue across its base), so transaction volume
  is the primary driver to monitor at renewal.
