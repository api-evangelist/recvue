actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and RecVue's own public API is
    request/response REST plus a Bulk API and asynchronous concurrent programs.
    No AsyncAPI document was created because there is no server-push transport on
    RecVue's API to model; asynchronous completion is delivered by status
    polling or an HTTP callback webhook.
