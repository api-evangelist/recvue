aid: recvue
url: https://raw.githubusercontent.com/api-evangelist/recvue/refs/heads/main/apis.yml
name: RecVue
kind: company
description: RecVue is an enterprise revenue management platform (RevOS - the Revenue
  Operating System) that unifies complex billing, revenue recognition, order-to-cash,
  usage-based monetization, and partner settlements for the office of the CFO. It
  automates recurring, usage, milestone, and hybrid billing models and recognizes
  revenue in compliance with ASC 606 and IFRS 15, with performance-obligation
  tracking, allocation, deferral, and audit trails. RecVue is API-first and exposes
  a documented, RESTful developer API (JSON, OAuth2 client-credentials, a Bulk API
  for large data sets, and official Node, Ruby, JavaScript, and Python client
  libraries) covering orders, order lines, bill runs, billing schedules, pricing,
  usage/deliveries, customers, invoices/adjustments, and revenue contracts. The
  platform is enterprise/sales-gated for provisioning (production and sandbox
  tenants), but the API reference is public at developer.recvue.com.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Revenue Recognition
- ASC 606
- Billing
- Order-to-Cash
- Revenue Management
- Usage-Based Billing
- Partner Settlements
- IFRS 15
- Subscription Billing
- Enterprise
