    type: Documentation
  - url: https://developer.recvue.com/reference/getrevcontractamendsetup
    type: APIReference
  - url: openapi/recvue-openapi.yml
    type: OpenAPI
  - url: collections/recvue.postman_collection.json
    type: PostmanCollection
  - url: collections/recvue.opencollection.json
    type: OpenCollection
  description: >-
    Configure and track ASC 606 / IFRS 15 revenue recognition. Get, create, and
    update revenue-contract amendment setups (performance-obligation and
    compliance controls) and read the amendment audit history. Revenue schedules,
    allocation, and deferral are generated by RecVue's recognition engine and run
    via the concurrent-program execution endpoint.
