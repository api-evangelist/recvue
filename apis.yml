- aid: recvue:recvue-revenue-recognition-api
  name: RecVue Revenue Recognition API
  tags:
  - Revenue Recognition
  - ASC 606
  - IFRS 15
  - Revenue Contracts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.recvue.com/reference/getrevcontractamendsetup
  baseURL: https://api.recvue.com/api/v2.0
